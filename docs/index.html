<!DOCTYPE html>

<head>

<title>Mis Gastos</title>
<style>
:root{--bg:#eaf1ec;--card:#fff;--ink:#10261c;--deep:#0e3b2a;--mut:#5c6f65;--line:#dde7e0;--soft:#dcebe1;--sun:#ffc43d;--red:#d93f3f;--green:#1e8e5a;
--num:"Avenir Next Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,Roboto,system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between}
#top h1{font:700 24px/1 var(--num);margin:0;letter-spacing:-.01em}
.mon{display:flex;align-items:center;background:#fff;border-radius:999px;padding:2px}
.mon button{font-size:20px;width:36px;height:36px;color:var(--mut);border-radius:50%}
.mon button:active{background:var(--soft)}
.mon span{min-width:98px;text-align:center;font-weight:600;font-size:14px}
main{padding:6px 14px 112px;max-width:560px;margin:auto}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:700}
.hero{background:var(--deep);color:#fff;border-radius:28px;padding:22px 20px 18px;margin-bottom:12px}
.hero .lbl{color:#b9d3c5;font-size:14px}
.hero .big{font:700 52px/1 var(--num);letter-spacing:-.02em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--sun)}
.bar.over i{background:#ff8b8b}
.days{display:flex;align-items:flex-end;gap:2px;height:56px;margin-top:20px}
.days i{flex:1;border-radius:3px 3px 1px 1px;background:#4f8a6d;min-height:3px}
.days i.z{background:rgba(255,255,255,.14)}
.days i.now{background:var(--sun)}
.dax{display:flex;justify-content:space-between;font-size:11px;color:#8fb3a0;margin-top:5px}
.trio{display:flex;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.trio div{flex:1;font-size:13px;color:#b9d3c5}
.trio b{display:block;color:#fff;font:700 20px/1.2 var(--num);font-variant-numeric:tabular-nums}
.alert{display:flex;align-items:center;gap:12px;background:#fff6dc;border-radius:20px;padding:14px 16px;margin-bottom:12px;width:100%;text-align:left}
.alert div{flex:1;font-size:13px;color:#5b4a12}
.alert b{display:block;font-size:15px;color:#3a2e05}
.alert span{background:var(--ink);color:#fff;font-weight:600;font-size:13px;padding:9px 14px;border-radius:99px}
.stack{display:flex;gap:3px;height:14px;margin-bottom:10px}
.stack i{border-radius:5px;min-width:5px}
.leg{width:100%;display:flex;align-items:center;gap:10px;padding:8px 0}
.leg i{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.leg span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg em{font-style:normal;color:var(--mut);font-size:13px;width:38px;text-align:right}
.leg b{font:700 16px var(--num);width:96px;text-align:right;font-variant-numeric:tabular-nums}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tx:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:0 0 42px}
.tx .mid{flex:1;min-width:0}
.tx .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .end{text-align:right}
.tx .amt{font:700 17px/1.3 var(--num);white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.in{color:var(--green)}
.tag{display:inline-block;font-size:11px;font-weight:600;background:var(--soft);color:var(--deep);border-radius:99px;padding:0 7px;margin-left:6px;vertical-align:1px}
.day{font-size:13px;font-weight:600;color:var(--mut);margin:16px 6px 6px;display:flex;justify-content:space-between}
.day span:first-child::first-letter{text-transform:uppercase}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:#fff;font-size:14px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--ink);color:#fff}
input[type=text],input[type=search],input[type=datetime-local],select,textarea{width:100%;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:0}
input[type=search]{border-color:transparent;border-radius:99px;padding-left:18px}
input:focus,select:focus,textarea:focus{border-color:var(--deep)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:16px 0 6px}
.btn{display:block;width:100%;padding:14px;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;text-align:center}
.btn:active{opacity:.85}
.btn.sec{background:var(--soft);color:var(--deep)}
.btn.dan{background:#fde6e6;color:var(--red)}
.btns{display:flex;gap:10px;margin-top:16px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:536px;margin:auto;background:var(--ink);border-radius:26px;display:flex;align-items:center;z-index:6;padding:6px;box-shadow:0 10px 24px rgba(16,38,28,.28)}
nav button[data-v]{flex:1;padding:8px 0 6px;font-size:11px;font-weight:500;color:#8fa89b;border-radius:20px}
nav svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff}
#fab{flex:0 0 54px;height:54px;margin:0 6px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center}
#fab svg{width:26px;height:26px;stroke-width:2.6;margin:0}
#fab:active{transform:scale(.94)}
#ov{position:fixed;inset:0;background:rgba(16,38,28,.5);z-index:20;display:none;align-items:flex-end}
#ov.on{display:flex}
#sheet{background:#fff;width:100%;max-width:560px;margin:auto auto 0;border-radius:28px 28px 0 0;padding:10px 18px 24px;max-height:92vh;overflow:auto;animation:up .22s ease-out}
#sheet::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
#sheet h3{margin:0 0 4px;font:700 22px var(--num)}
.seg{display:flex;background:var(--bg);border-radius:99px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:99px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--ink);color:#fff}
input.money{font:700 40px var(--num);text-align:center;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 0 8px;font-variant-numeric:tabular-nums}
input.money:focus{border-color:var(--sun)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{padding:10px 2px 8px;border-radius:16px;background:var(--bg);font-size:11px;font-weight:500;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:2px solid transparent}
.cat b{display:block;font-size:22px;font-weight:400;margin-bottom:2px}
.cat.on{border-color:var(--ink);background:#fff;font-weight:700}
.raw{font-size:13px;color:var(--mut);background:var(--bg);border-radius:14px;padding:12px;margin-top:14px;word-break:break-word}
.status{display:flex;align-items:center;gap:10px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:0 0 10px;box-shadow:0 0 0 4px #fde6e6}
.dot.ok{background:var(--green);box-shadow:0 0 0 4px #d8f0e3}
.hint{font-size:13px;color:var(--mut);margin:8px 0 0}
.hbar{margin:12px 0}
.hbar .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.hbar .top b{font:700 16px var(--num);font-variant-numeric:tabular-nums}
.hbar .trk{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.hbar .trk i{display:block;height:100%;border-radius:99px}
.cols{display:flex;align-items:flex-end;gap:10px;height:160px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mut)}
.cols i{display:block;width:100%;border-radius:10px;background:var(--soft);min-height:4px}
.cols .cur i{background:var(--deep)}
.cols .cur em,.cols .cur span{color:var(--ink);font-weight:700}
.cols span{margin-top:6px;text-transform:capitalize}
.cols em{font:600 12px var(--num);margin-bottom:4px}
.rowb{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.rowb:last-child{border:0}
.rowb span{flex:1}
.rowb b{font:700 16px var(--num);font-variant-numeric:tabular-nums}
ol{padding-left:20px;margin:10px 0 0;font-size:13px;color:var(--mut)}
ol li{margin-bottom:5px}
#toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>

<div id="top"><h1 id="ttl">Mis Gastos</h1><div class="mon"><button onclick="mv(-1)">‹</button><span id="monL"></span><button onclick="mv(1)">›</button></div></div>
<main id="main"></main>
<nav>
<button data-v="inicio" onclick="go('inicio')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
<button data-v="movs" onclick="go('movs')"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Movimientos</button>
<button id="fab" onclick="openForm()" aria-label="Agregar movimiento"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<button data-v="rep" onclick="go('rep')"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Reportes</button>
<button data-v="aj" onclick="go('aj')"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>Ajustes</button>
</nav>
<div id="ov" onclick="if(event.target===this)closeSheet()"><div id="sheet"></div></div>

<script>
/* ---------- Puente con Android (o datos de ejemplo si se abre en un navegador) ---------- */
var WEB=!window.Native;
var web=(function(){
  var KEY="misgastos.v1",d;
  var CATS=[["Mercado","🛒","#22c55e"],["Comida","🍔","#f97316"],["Transporte","🚌","#3b82f6"],["Servicios","💡","#eab308"],["Suscripciones","📺","#a855f7"],["Salud","💊","#ef4444"],["Compras","🛍️","#ec4899"],["Entretenimiento","🎬","#06b6d4"],["Educación","🎓","#6366f1"],["Hogar","🏠","#84cc16"],["Efectivo","💵","#10b981"],["Transferencias","🔁","#64748b"],["Ingresos","💰","#14b8a6"],["Otros","📦","#94a3b8"]];
  var RULES={"Mercado":"exito,carulla,jumbo,d1,ara,olimpica,makro,pricesmart,surtimax,mercado,supermercado,fruver,euro,isimo,dollarcity","Comida":"rappi,didi food,ifood,restaurante,mcdonalds,kfc,corral,crepes,subway,dominos,pizza,frisby,juan valdez,starbucks,tostao,panaderia,cafe,burger,pollo,asadero,helados","Transporte":"uber,didi,cabify,indrive,terpel,texaco,primax,esso,gasolina,eds,peaje,parqueadero,transmilenio,sitp,tullave,civica,metro de medellin,taxi","Servicios":"claro,movistar,tigo,wom,etb,epm,enel,vanti,codensa,acueducto,gas natural,internet,celsia,air-e,afinia","Suscripciones":"netflix,spotify,disney,hbo,max,prime video,amazon prime,youtube,google,apple,icloud,chatgpt,openai,claude,anthropic,microsoft","Salud":"farmacia,drogueria,drogas,cruz verde,farmatodo,cafam,colsubsidio,eps,clinica,dental,optica,laboratorio","Compras":"falabella,mercadolibre,mercado libre,mercadopago,amazon,shein,temu,zara,homecenter,alkosto,ktronix,decathlon,tennis,arturo calle","Entretenimiento":"cine,cinecolombia,cine colombia,cinemark,procinal,bar,steam,playstation,xbox,tuboleta","Educación":"universidad,asturias,colegio,udemy,platzi,coursera,libreria","Efectivo":"cajero"};
  function fresh(){var r=[];for(var c in RULES)RULES[c].split(",").forEach(function(k){r.push({keyword:k,category:c})});
    return{tx:[],categories:CATS.map(function(c){return{name:c[0],icon:c[1],color:c[2]}}),rules:r,settings:[],unparsed:[],seq:1}}
  function rd(){try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){d=null}if(!d||!d.tx)d=fresh()}
  function wr(){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){toast("No se pudo guardar: almacenamiento lleno o bloqueado")}}
  function sortTx(){d.tx.sort(function(a,b){return b.ts-a.ts||b.id-a.id})}
  rd();
  /* ----- lector de mensajes del banco (mismo criterio que la app Android) ----- */
  function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
  var STOP="(?=\\s+(?:con\\s+(?:tu|la|tarjeta|t\\.)|desde\\b|el\\s+\\d|a\\s+las\\b|por\\s+\\$|fue\\b|de\\s+tu\\b|en\\s+tu\\b|en\\s+la\\s+cuenta|a\\s+tu\\b|hoy\\b)|\\s+\\d{1,2}[:/]\\d{2}|\\s*[.,;!]\\s|\\s*[.!]?\\s*$)";
  var M_EN=new RegExp("\\ben\\s+(?!tu\\b|la\\s+cuenta|su\\b)(.+?)"+STOP,"gi"),
      M_A=new RegExp("\\ba\\s+(?!las\\b|tu\\b|trav|su\\b)((?:la\\s+cuenta\\s+|la\\s+llave\\s+|el\\s+n[uú]mero\\s+)?.+?)"+STOP,"gi"),
      M_DE=new RegExp("\\bde\\s+(?!tu\\b|\\$|su\\b|una\\b)((?:la\\s+cuenta\\s+)?.+?)"+STOP,"gi");
  function first(re,s){re.lastIndex=0;var m;while((m=re.exec(s))){var g=m[1].trim();if(g.length>=2&&g.charAt(0)!="$")return g;if(m.index===re.lastIndex)re.lastIndex++}return null}
  function amount(s){s=s.replace(/[.,]+$/,"");if(/[.,]\d{2}$/.test(s))s=s.slice(0,-3);s=s.replace(/\D/g,"");return!s||s.length>12?0:+s}
  function parse(text){
    text=String(text||"").replace(/\s+/g," ").trim();var n=norm(text),acc=n.indexOf("nequi")>=0?"Nequi":n.indexOf("bancolombia")>=0?"Bancolombia":"Otra";
    if(/\b(codigo|clave|otp|token|contrasena|pin)\b/.test(n)||/rechazad|declinad|no fue exitos|no exitos|fallid|no pudimos|descuento|oferta|preaprobad|\bgana\b|\baprovecha\b|\bsolicita\b/.test(n))return null;
    var kind;
    if(/\b(recibiste|recepcion|te enviaron|te consignaron|consignacion|abono|te llego|te pagaron|te transfirieron)\b/.test(n))kind="ingreso";
    else if(/\b(retiraste|retiro|sacaste)\b/.test(n))kind="retiro";
    else if(/\b(compraste|compra)\b/.test(n))kind="compra";
    else if(/\b(transferiste|transferencia|enviaste|envio)\b/.test(n))kind="transferencia";
    else if(/\b(pagaste|pago)\b/.test(n))kind="pago";
    else return null;
    var am=/(?:\$|\bcop)\s*([0-9][0-9.,]*)/i.exec(text);if(!am)return null;
    var a=amount(am[1]);if(a<=0)return null;
    var after=text.slice(am.index+am[0].length),m;
    if(kind=="ingreso")m=first(M_DE,after)||first(M_DE,text);else m=first(M_EN,after)||first(M_A,after)||first(M_EN,text);
    m=(m||"").replace(/^[\s:*-]+/,"").replace(/[\s.,;:!-]+$/,"").trim().slice(0,40).trim();
    return{type:kind=="ingreso"?"ingreso":"gasto",kind:kind,account:acc,merchant:m,amount:a}
  }
  function categorize(merchant,kind){
    var m=" "+norm(merchant).replace(/[^a-z0-9]+/g," ").trim()+" ",best=null,bl=0;
    if(m.trim())d.rules.forEach(function(r){var k=norm(r.keyword).replace(/[^a-z0-9]+/g," ").trim();if(k.length>bl&&m.indexOf(" "+k+" ")>=0){best=r.category;bl=k.length}});
    return best||(kind=="retiro"?"Efectivo":kind=="transferencia"?"Transferencias":kind=="ingreso"?"Ingresos":"Otros")
  }
  function download(name,mime,text){
    var f=null;try{f=new File([text],name,{type:mime})}catch(e){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)
  }
  function q(s){return'"'+String(s==null?"":s).replace(/"/g,'""').replace(/\n/g," ")+'"'}
  return{parse:parse,
    all:function(){rd();return JSON.stringify(d)},
    saveTx:function(j){var o=JSON.parse(j);if(o.id){var t=d.tx.filter(function(x){return x.id==o.id})[0];if(t)for(var k in o)t[k]=o[k]}else{o.id=d.seq++;o.source="manual";o.raw="";d.tx.push(o)}sortTx();wr();return""+o.id},
    deleteTx:function(i){d.tx=d.tx.filter(function(x){return x.id!=i});wr()},
    saveCategory:function(j){var o=JSON.parse(j),old=o.old||o.name,c=d.categories.filter(function(x){return x.name==old})[0];
      if(c){c.name=o.name;c.icon=o.icon;c.color=o.color;if(old!=o.name){d.tx.forEach(function(t){if(t.category==old)t.category=o.name});d.rules.forEach(function(r){if(r.category==old)r.category=o.name})}}
      else d.categories.push({name:o.name,icon:o.icon,color:o.color});wr()},
    deleteCategory:function(n){if(n=="Otros")return;d.tx.forEach(function(t){if(t.category==n)t.category="Otros"});d.rules=d.rules.filter(function(r){return r.category!=n});d.categories=d.categories.filter(function(x){return x.name!=n});wr()},
    setRule:function(k,c){k=norm(k).trim();if(k.length<2)return;d.rules=d.rules.filter(function(r){return r.keyword!=k});d.rules.push({keyword:k,category:c});wr()},
    setSetting:function(k,v){d.settings=d.settings.filter(function(x){return x.k!=k});d.settings.push({k:k,v:v});wr()},
    clearUnparsed:function(){d.unparsed=[];wr()},listenerEnabled:function(){return true},openListenerSettings:function(){},openAppInfo:function(){},
    testParse:function(t){var r=parse(t);if(!r)return"null";r.category=categorize(r.merchant,r.kind);return JSON.stringify(r)},
    simulate:function(t){var r=parse(t);if(!r)return false;var now=Date.now(),h=norm(t).replace(/\s+/g," ").trim();
      if(d.tx.some(function(x){return(x.hash==h&&x.ts>now-432e5)}))return false;
      d.tx.push({id:d.seq++,ts:now,amount:r.amount,type:r.type,category:categorize(r.merchant,r.kind),merchant:r.merchant,note:"",account:r.account,source:"auto",raw:t,hash:h});sortTx();wr();return true},
    exportData:function(f){var day=new Date().toISOString().slice(0,10);

function closeSheet(){F=null;$("ov").className="";load();render()}

function openPaste(){
  F={};$("sheet").innerHTML='<h3>Pegar mensaje del banco</h3><p class="hint">Copia el SMS o el aviso de Bancolombia o Nequi y pégalo. La app saca el monto, el comercio y la categoría.</p><textarea id="pst" rows="4" oninput="pastePrev()" style="margin-top:12px" placeholder="Ej: Bancolombia: Compraste $25.900,00 en RAPPI con tu T.Deb *1234…"></textarea><div id="pstR" class="hint"></div><div class="btns"><button class="btn sec" onclick="clip()">Pegar del portapapeles</button><button class="btn" onclick="pasteSave()">Registrar</button></div>';
  $("ov").className="on";clip(true);
}
function clip(quiet){if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(function(t){if(t&&$("pst")){if(quiet&&!web.parse(t))return;$("pst").value=t;pastePrev()}}).catch(function(){if(!quiet)toast("Mantén presionado el cuadro y elige Pegar")});else if(!quiet)toast("Mantén presionado el cuadro y elige Pegar")}
function pastePrev(){var r=JSON.parse(N.testParse($("pst").value)||"null");$("pstR").innerHTML=r?"✅ "+(r.type=="ingreso"?"Ingreso":"Gasto")+" de <b>"+fmt(r.amount)+"</b>, "+esc(r.merchant||"sin comercio")+", "+esc(r.category):""}
function pasteSave(){var t=$("pst").value.trim();if(!t){toast("Pega primero el mensaje");return}
  if(!web.parse(t)){$("pstR").innerHTML="❌ No lo reconozco como compra, pago o transferencia. Regístralo con el botón amarillo.";return}
  if(N.simulate(t)){closeSheet();toast("Movimiento registrado ✔")}else toast("Ese mensaje ya estaba registrado")}

/* ---------- Categorias ---------- */
var COLORS=["#22c55e","#f97316","#3b82f6","#eab308","#a855f7","#ef4444","#ec4899","#06b6d4","#6366f1","#84cc16","#10b981","#64748b"],K=null;
function openCat(i){
  var c=i>=0?S.categories[i]:null;K={old:c?c.name:"",name:c?c.name:"",icon:c?c.icon:"🏷️",color:c?c.color:COLORS[S.categories.length%12]};F={};drawCat();$("ov").className="on";
}
function drawCat(){
  var lock=K.old=="Otros"||K.old=="Ingresos";
  $("sheet").innerHTML="<h3>"+(K.old?"Editar categoría":"Nueva categoría")+'</h3><label>Nombre</label><input id="kN" type="text" value="'+esc(K.name)+'"'+(lock?" disabled":"")+'><label>Ícono (emoji)</label><input id="kI" type="text" value="'+esc(K.icon)+'" maxlength="4"><label>Color</label><div class="chips">'+COLORS.map(function(c){return'<button onclick="K.name=$(\'kN\').value;K.icon=$(\'kI\').value;K.color=\''+c+'\';drawCat()" style="flex:0 0 34px;height:34px;border-radius:50%;background:'+c+";border:3px solid "+(K.color==c?"#0f172a":"transparent")+'"></button>'}).join("")+'</div><div class="btns">'+(K.old&&!lock?'<button class="btn dan" style="flex:0 0 34%" onclick="delCat()">Eliminar</button>':"")+'<button class="btn" onclick="saveCat()">Guardar</button></div>';
}
function saveCat(){var n=$("kN").value.trim();if(!n){toast("Escribe un nombre");return}N.saveCategory(JSON.stringify({old:K.old,name:n,icon:$("kI").value.trim()||"🏷️",color:K.color}));closeSheet()}
function delCat(){if(!delCat.c){delCat.c=1;toast("Toca otra vez: sus movimientos pasan a “Otros”");setTimeout(function(){delCat.c=0},2500);return}delCat.c=0;N.deleteCategory(K.old);closeSheet()}

load();render();
</script>
</body>
</html>
